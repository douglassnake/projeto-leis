name: Indexar dispositivos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/indexar_dispositivos.py'
      - '.github/workflows/dispositivos.yml'
  schedule:
    - cron: '47 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: indexar-dispositivos
  cancel-in-progress: false
jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes de extração
        run: python -m unittest discover -s tests -v
      - name: Extrair artigos das fontes oficiais
        run: python scripts/indexar_dispositivos.py
      - name: Comparar assinaturas e registrar revisão pendente
        run: python scripts/comparar_versoes.py
      - name: Persistir índice experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dispositivos.json data/revisoes.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar índice experimental de dispositivos"
            git pull --rebase origin main
            git push
          fi
