name: Conferir fontes oficiais
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coleta-fontes
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar catálogo
        run: python -m unittest discover -s tests -v
      - name: Verificar links oficiais
        run: python scripts/coletar.py
      - name: Descobrir referências de novas leis
        run: python scripts/descobrir_leis.py
      - name: Registrar relatório quando houver mudança
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coleta.json data/novidades.json
          if ! git diff --cached --quiet; then
            git commit -m "data: registrar conferência diária de fontes"
            git push
          fi
