name: Validar catálogo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar índices e vínculos
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxe Python
        run: python -m compileall -q scripts tests
