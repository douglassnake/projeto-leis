name: Publicar portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar dados antes de publicar
        run: python -m unittest discover -s tests -v
      - name: Configurar e habilitar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar apenas arquivos públicos
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/leis.json data/novidades.json data/coleta.json _site/data/
          touch _site/.nojekyll
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
